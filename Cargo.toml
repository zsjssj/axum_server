[package]
name = "rust-axum-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# 仅用于启动期（src/main.rs 的 run）：启动失败既没有请求也没有响应，需要的是一层层可读的上下文，
# 而不是 HTTP 状态码映射。边界是 anyhow 只允许出现在 main.rs——运行期的 Handler / Service /
# Repository 必须继续返回带类型的 AppError，由它决定对外状态码与业务码，详见 docs/07 第 7.4 节。
anyhow = "1"
argon2 = "0.6.0"
axum = "0.7"
bb8 = "0.9.1"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
# 仅用于解析请求中的 Cookie 头；Set-Cookie 由项目自行拼装以精确控制安全属性。
cookie = "0.18"
dotenvy = "0.15.7"
jsonwebtoken = "9"
rand = "0.8"
# script 特性用于 EVAL：登录失败计数需要「修剪 + 写入 + 统计」原子完成。
# tokio-rustls-comp 让 `rediss://` 真正可用（TLS 连接），配置校验也接受该协议。
redis = { version = "1.7.1", default-features = false, features = [
    "tokio-comp",
    "bb8",
    "script",
    "tokio-rustls-comp",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.5", features = ["cors","trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["serde", "v7"] }
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
